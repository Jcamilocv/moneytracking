# PREPARED ONLY: install ONLY after independent QA and explicit approval.
# Target: moneytips-morning-shadow@scheduled.service.d/20-publish.conf
# Inherits existing nobody/nogroup, sandbox, StateDirectory, flock and IP deny.
[Unit]
Description=Money Tips Morning publisher at 10:00 Madrid

[Service]
Environment=MORNING_MODE=PUBLISH
Environment=MORNING_PUBLISH_ENABLED=false
Environment=MORNING_PUBLISH_SECRET_FILE=/var/lib/moneytips-morning/publish-secret
ExecStart=
ExecStart=/usr/bin/flock --nonblock --conflict-exit-code 75 /var/lib/moneytips-morning/run.lock /usr/bin/node /opt/moneytips-morning/server/morning/run-publisher.mjs --scheduled
