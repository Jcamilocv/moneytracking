<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Configuración — Money Tips Morning Mac</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 650px; margin: 0 auto; line-height: 1.5; font-size: 14px; }
    h1 { font-size: 18px; margin-bottom: 4px; color: #38bdf8; }
    p.subtitle { color: #94a3b8; margin-top: 0; margin-bottom: 20px; font-size: 13px; }
    .card { background: #1e293b; border-radius: 8px; padding: 18px; margin-bottom: 20px; border: 1px solid #334155; }
    label { display: block; font-weight: 500; margin-bottom: 6px; }
    input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 8px 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 13px; margin-bottom: 14px; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    button { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
    button:hover { background: #0369a1; }
    .status-msg { margin-top: 12px; font-size: 12px; }
    .status-success { color: #4ade80; }
    .status-error { color: #f87171; }
    pre { background: #0f172a; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; color: #cbd5e1; }
  </style>
</head>
<body>
  <h1>☀️ Configuración — Money Tips Morning Asistido</h1>
  <p class="subtitle">Modo asistido en MacBook personal (Perfil «Camilo»)</p>

  <div class="card">
    <form id="config-form">
      <label for="endpoint">Endpoint Ingesta MoneyTracKING:</label>
      <input type="text" id="endpoint" name="endpoint" required />

      <label for="token">Token Local de Dispositivo (FUTBOLBRAIN_LOCAL_INGEST_SECRET):</label>
      <input type="password" id="token" name="token" placeholder="Introduce el token de ingest..." />

      <div class="checkbox-row">
        <input type="checkbox" id="armed" name="armed" />
        <label for="armed" style="margin-bottom:0;">Armar publicación (habilitar envíos cuando los candidatos sean válidos)</label>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="autoSubmit" name="autoSubmit" />
        <label for="autoSubmit" style="margin-bottom:0;">Envío automático al detectar Tablero (sin clic manual)</label>
      </div>

      <button type="submit">Guardar configuración</button>
      <div id="status-msg" class="status-msg"></div>
    </form>
  </div>

  <div class="card">
    <label>Recibos y Envíos Registrados Hoy:</label>
    <pre id="claims-view">Cargando...</pre>
  </div>

  <script src="options.js"></script>
</body>
</html>
